name: Generate Weekly Gaming Summary

on:
  schedule:
    # runs every Friday at 12:00 PM
    - cron: "0 12 * * 5"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Summary Script
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT: ${{ secrets.APPWRITE_PROJECT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          ARTICLES_COLLECTION_ID: ${{ secrets.ARTICLES_COLLECTION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        working-directory: ./apps/backend
        run: npm run summary:weekly

      # The summary renders in the home page recap. This job runs once a week,
      # so an unconditional ping costs one invocation a week — not worth
      # gating on log output the way the 5-minute RSS job does.
      - name: Revalidate web home cache
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_URL / REVALIDATE_SECRET secrets are missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"target":"home","tags":["news:weekly-summary"]}'
