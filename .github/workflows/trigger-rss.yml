name: RSS fetch and write to Appwrite

on:
  schedule:
    # runs every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run RSS fetch script
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT: ${{ secrets.APPWRITE_PROJECT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          RSS_COLLECTION_ID: "news_sources"
          ARTICLES_COLLECTION_ID: "articles"
          FCM_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        working-directory: ./apps/backend
        run: |
          set -o pipefail
          npm run fetch:rss 2>&1 | tee "$RUNNER_TEMP/rss.log"

      # This job runs every 5 minutes, so the web app is only pinged when the
      # fetch actually wrote articles — an unconditional ping would cost 288
      # Vercel function invocations a day, more than the staleness it prevents.
      #
      # The ids written by rss.service.ts are the whole point: they let the
      # revalidate step below regenerate exactly the article pages that just
      # appeared, instead of dropping every news:* tag and both home paths. Both
      # home pages do render the news feed, so those stay in the payload.
      #
      # No anchor on the grep pattern: pino-pretty emits a timestamp prefix and
      # ANSI colour codes, and the marker appears once per source that wrote.
      - name: Collect newly written article ids
        id: detect
        run: |
          set -euo pipefail
          IDS=$(grep -oE 'NEW_ARTICLE_IDS=[0-9a-f]{36}(,[0-9a-f]{36})*' "$RUNNER_TEMP/rss.log" \
            | sed 's/^NEW_ARTICLE_IDS=//' \
            | paste -sd, - || true)

          if [ -z "$IDS" ]; then
            echo "No new articles persisted — skipping web revalidation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "article_ids=${IDS}" >> "$GITHUB_OUTPUT"
            echo "New articles persisted — web cache will be revalidated."
          fi

      - name: Revalidate web news cache
        if: steps.detect.outputs.changed == 'true'
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ARTICLE_IDS: ${{ steps.detect.outputs.article_ids }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_URL / REVALIDATE_SECRET secrets are missing."
            exit 1
          fi

          # Expand the id list into paths and tags:
          #   tags:  news:article:<id>   (the per-article data-cache entry)
          #   paths: /en/news/<id>, /ar/news/<id>  (generate the new pages eagerly,
          #          so the first visitor gets a CDN hit rather than a cold render)
          #          /en, /ar             (home aggregates the news feed)
          PAYLOAD=$(jq -n \
            --arg ids "$ARTICLE_IDS" \
            '($ids | split(",")) as $ids
             | {
                 tags: ($ids | map("news:article:" + .)),
                 paths: (
                   ["/en", "/ar"]
                   + (($ids | map(["/en/news/" + ., "/ar/news/" + .]) | add) // [])
                 )
               }')

          echo "Revalidating $(jq -r '.tags | length' <<< "$PAYLOAD") new article(s)."
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
