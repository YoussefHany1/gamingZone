name: Trigger Games Fetch

on:
  schedule:
    # runs every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-hourly-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Trigger Games Fetch
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT: ${{ secrets.APPWRITE_PROJECT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}

          RSS_COLLECTION_ID: "news_sources"
          ARTICLES_COLLECTION_ID: "articles"
          FCM_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        working-directory: ./apps/backend
        run: |
          set -o pipefail
          npm run fetch:free-games 2>&1 | tee "$RUNNER_TEMP/free-games.log"

      # Only a membership change (a game newly becomes free, or stops being free) is
      # worth a revalidation.
      #
      # This gate used to match "Updated details", which the job prints on every
      # hourly field refresh, so it revalidated on nearly every run. A routine
      # price/date refresh changes nothing the home page or browse page actually
      # shows, and re-rendering four paths an hour for it is pure waste.
      - name: Detect changed free-game membership
        id: detect
        run: |
          set -euo pipefail
          if grep -qE 'Created NEW game document|FREE_GAMES_REMOVED=[1-9]' "$RUNNER_TEMP/free-games.log"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Free games membership changed — web cache will be revalidated."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No membership changes — skipping revalidation."
          fi

      - name: Revalidate web games cache
        if: steps.detect.outputs.changed == 'true'
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_URL / REVALIDATE_SECRET secrets are missing."
            exit 1
          fi
          # Free games render on the home pages and on the /[locale]/games browse
          # page, so all four paths need regenerating. /[locale]/games became a
          # real ISR route once search moved to /[locale]/games/search, so unlike
          # before it now has cached HTML that will not pick up the new tag drop
          # on its own.
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"target":"games","paths":["/en","/ar","/en/games","/ar/games"]}'

      # Events come straight from a live upstream API with no write step to hook
      # into, and nothing else in this repo drops the "events" tag — so the
      # fetchGamingEvents TTL was the only freshness mechanism for event data.
      # That is what let events/[id] move to a long backstop window in the first
      # place, which only pays off if something still refreshes it on demand.
      #
      # Unconditional, unlike the step above: there is no log line that means
      # "the upstream event list changed", because nothing compares it to a
      # previous version. Once an hour matches how fast event status shifts and
      # costs two ISR writes.
      #
      # Only the home pages, not the /events/[id] detail pages: those carry the
      # 24h backstop and their content changes far more slowly than the home
      # carousel does.
      - name: Revalidate web events cache
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_URL / REVALIDATE_SECRET secrets are missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"target":"events","paths":["/en","/ar"]}'
