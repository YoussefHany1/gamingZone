name: RSS fetch and write to Appwrite

on:
  schedule:
    # runs every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run RSS fetch script
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT: ${{ secrets.APPWRITE_PROJECT }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          RSS_COLLECTION_ID: "news_sources"
          ARTICLES_COLLECTION_ID: "articles"
          FCM_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        working-directory: ./apps/backend
        run: |
          set -o pipefail
          npm run fetch:rss 2>&1 | tee "$RUNNER_TEMP/rss.log"

      # This job runs every 5 minutes, so the web app is only pinged when the
      # fetch actually wrote articles — an unconditional ping would cost 288
      # Vercel function invocations a day, more than the staleness it prevents.
      # The revalidate segment windows (6h) are the fallback if this never runs.
      - name: Detect newly written articles
        id: detect
        run: |
          if grep -q "Saved and queued" "$RUNNER_TEMP/rss.log"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New articles persisted — web cache will be revalidated."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new articles — skipping revalidation."
          fi

      - name: Revalidate web news cache
        if: steps.detect.outputs.changed == 'true'
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_URL / REVALIDATE_SECRET secrets are missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"target":"news"}'
